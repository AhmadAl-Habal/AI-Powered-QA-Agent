name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax and schema checks
        run: npm run check

      # Full Playwright + Ollama execution is intentionally not run on a
      # GitHub-hosted runner. Add a configured self-hosted job when the target
      # QA environment, local models, browser auth, and test data are available.
